schemaVersion: "0.2"
project:
  id: prj-course-desk
  name: Course Desk
  modelRevision: rev-3-bd922e630c6e
  status: approved
  description: Draft bootstrapped from the repository at commit adb423c; not reviewed. Students enroll in courses and every enrollment decision is announced as a notification. NestJS API (server/, in-memory storage) plus a React page (web/). Based on README.md and the sources.
actors:
  - id: act-student
    kind: actor
    owner: prj-course-desk
    name: Student
    description: The only kind of user. The code has no authentication; a student is just a free-form studentId string sent by the client (web/src/components/EnrollmentForm.tsx defaults to "stu-ada").
modules:
  - id: mod-enrollment
    kind: module
    owner: prj-course-desk
    name: Enrollment
    description: server/src/enrollment/ (EnrollmentModule). EnrollmentService calls NotificationsService.notify directly (injected via NotificationsModule import); this is a direct call, not an event, so no events or contracts are modelled.
    purpose: Holds the course catalog and decides, records and exposes enrollments.
    dependsOn:
      - mod-notifications
  - id: mod-notifications
    kind: module
    owner: prj-course-desk
    name: Notifications
    description: server/src/notifications/ (NotificationsModule). Exports NotificationsService; has no dependencies.
    purpose: In-memory outbox of messages to recipients, readable over HTTP.
  - id: mod-web
    kind: module
    owner: prj-course-desk
    name: Web
    description: web/src (App.tsx, api/client.ts, components/). Depends on the other modules only through their HTTP routes under /api (api/client.ts), not through imports.
    purpose: Single-page React UI for enrolling and viewing the student's notifications.
    dependsOn:
      - mod-enrollment
      - mod-notifications
capabilities:
  - id: cap-list-courses
    kind: capability
    owner: mod-enrollment
    name: List courses with seats left
    description: GET /courses (enrollment.controller.ts). Initiator inferred from the UI; the API itself is open.
    initiatorActorId: act-student
  - id: cap-enroll
    kind: capability
    owner: mod-enrollment
    name: Enroll in a course
    description: POST /enrollments {studentId, courseId}. Always 201 with the recorded decision (confirmed or rejected); 400 for a malformed body, 404 for an unknown course. Spec and e2e tests were not read in full.
    initiatorActorId: act-student
  - id: cap-get-enrollment
    kind: capability
    owner: mod-enrollment
    name: Get an enrollment
    description: GET /enrollments/:id; 404 if unknown. Not used by the web client.
  - id: cap-list-notifications
    kind: capability
    owner: mod-notifications
    name: List notifications for a recipient
    description: GET /notifications?recipientId=...; 400 without recipientId; oldest first.
    initiatorActorId: act-student
  - id: cap-use-ui
    kind: capability
    owner: mod-web
    name: Enroll and see outcome via the page
    description: "App.tsx: submit the form, show outcome, then reload that student's notifications and the course seat counts."
    initiatorActorId: act-student
data:
  - id: dat-course
    kind: data
    owner: mod-enrollment
    name: Course
    description: Seeded in course-catalog.ts (Linear Algebra cap 2, Modern Poetry cap 1); fixed, no create/update API. seatsLeft in CourseSummary is derived (capacity minus confirmed enrollments).
    attributes:
      - id: att-course-id
        name: id
        type: id
      - id: att-course-title
        name: title
        type: string
      - id: att-course-capacity
        name: capacity
        type: integer
  - id: dat-enrollment
    kind: data
    owner: mod-enrollment
    name: Enrollment
    description: enrollment.types.ts, in-memory EnrollmentRepository; ids enr-N. status is confirmed|rejected; reason is COURSE_FULL|ALREADY_ENROLLED, set only when rejected. Rejections are stored too.
    attributes:
      - id: att-enr-id
        name: id
        type: id
      - id: att-enr-student
        name: studentId
        type: string
      - id: att-enr-course
        name: courseId
        type: reference
        refDataId: dat-course
      - id: att-enr-status
        name: status
        type: string
      - id: att-enr-reason
        name: reason
        type: string
        nullable: true
  - id: dat-notification
    kind: data
    owner: mod-notifications
    name: Notification
    description: notification.types.ts, in-memory outbox; ids ntf-N. kind is enrollment-confirmed|enrollment-rejected. enrollmentId points at an Enrollment in another module, so it is typed id rather than reference.
    attributes:
      - id: att-ntf-id
        name: id
        type: id
      - id: att-ntf-recipient
        name: recipientId
        type: string
      - id: att-ntf-kind
        name: kind
        type: string
      - id: att-ntf-message
        name: message
        type: string
      - id: att-ntf-enrollment
        name: enrollmentId
        type: id
rules:
  - id: rul-seat-limit
    kind: rule
    owner: mod-enrollment
    name: Course capacity
    description: enrollment.service.ts enroll(). Check-then-save is synchronous, so no race in this in-memory setup.
    ruleKind: invariant
    statement: Confirmed enrollments for a course never exceed its capacity; a request for a full course is rejected with COURSE_FULL.
  - id: rul-no-double-enroll
    kind: rule
    owner: mod-enrollment
    name: One confirmed enrollment per student per course
    description: enrollment.service.ts. Checked before capacity, so ALREADY_ENROLLED wins when both apply.
    ruleKind: invariant
    statement: A student already holding a confirmed enrollment in a course is rejected with ALREADY_ENROLLED and takes no seat.
  - id: rul-announce-every-decision
    kind: rule
    owner: mod-enrollment
    name: Every decision is notified
    description: enrollment.service.ts enroll(). Unknown course and malformed request produce no enrollment and no notification.
    ruleKind: policy
    statement: Each enrollment decision, confirmed or rejected, is recorded and results in exactly one notification to the student.
  - id: rul-request-valid
    kind: rule
    owner: mod-enrollment
    name: Enrollment request validation
    description: parseEnrollmentRequest in enrollment.types.ts.
    ruleKind: invariant
    statement: studentId and courseId must be non-empty strings; both are trimmed before use.
  - id: rul-recipient-required
    kind: rule
    owner: mod-notifications
    name: recipientId required
    description: notifications.controller.ts.
    ruleKind: invariant
    statement: Listing notifications requires a non-empty recipientId.
events: []
contracts: []
behaviors: []
criteria:
  - id: crt-rejection-notified
    kind: criterion
    owner: mod-enrollment
    name: A rejected enrollment is announced
    statement: A request for a full course is recorded as rejected with COURSE_FULL, and the student receives exactly one enrollment-rejected notification for that enrollment.
    verifies:
      - rul-announce-every-decision
      - rul-seat-limit
      - cap-enroll
    verification: required
  - id: crt-confirmation-notified
    kind: criterion
    owner: mod-enrollment
    name: A confirmed enrollment is announced
    statement: A request while seats are left is confirmed, takes a seat, and the student receives exactly one enrollment-confirmed notification for that enrollment.
    verifies:
      - rul-announce-every-decision
      - cap-enroll
    verification: required
  - id: crt-repeat-rejected
    kind: criterion
    owner: mod-enrollment
    name: A repeat request takes no second seat
    statement: A student already enrolled in a course is rejected with ALREADY_ENROLLED and no second seat is taken.
    verifies:
      - rul-no-double-enroll
    verification: optional
